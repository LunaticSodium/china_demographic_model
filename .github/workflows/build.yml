name: build-all-platforms

# 触发：手动（workflow_dispatch，随时点按钮出测试包）或推 v* tag（顺带发 Release）。
on:
  workflow_dispatch:
  push:
    # 端口开发期间：推该分支即触发构建（产物在 run 页下载）。合并 main 前可移除。
    branches: ['feat/avalonia-cross-platform']
    tags: ['v*']

env:
  DOTNET_VERSION: '10.0.x'
  SHARED: src/App/ChinaDemographicModel.App
  DESKTOP: src/App/ChinaDemographicModel.App.Desktop/ChinaDemographicModel.App.Desktop.csproj
  ANDROID: src/App/ChinaDemographicModel.App.Android/ChinaDemographicModel.App.Android.csproj
  IOSPROJ: src/App/ChinaDemographicModel.App.iOS/ChinaDemographicModel.App.iOS.csproj

jobs:
  # ---------- Windows: 自包含单文件 exe ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - name: Publish exe
        run: >
          dotnet publish ${{ env.DESKTOP }} -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/windows
      - name: Clean symbols
        shell: bash
        run: rm -f out/windows/*.pdb
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-exe
          path: out/windows/*.exe

  # ---------- Android: 签名 apk（可直接侧载测试）----------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Install android workload
        run: dotnet workload install android
      - name: Generate signing keystore
        run: >
          keytool -genkeypair -v -keystore ci.keystore -alias ci
          -keyalg RSA -keysize 2048 -validity 10000
          -storepass android -keypass android
          -dname "CN=ChinaDemographicModel CI, O=demo, C=CN"
      - name: Publish apk
        run: >
          dotnet publish ${{ env.ANDROID }} -c Release -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT"
          -p:AcceptAndroidSdkLicenses=true
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$PWD/ci.keystore"
          -p:AndroidSigningStorePass=android
          -p:AndroidSigningKeyAlias=ci
          -p:AndroidSigningKeyPass=android
          -o out/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/android/*-Signed.apk

  # ---------- macOS: .app 打包成 .dmg（自包含，未签名）----------
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - name: Publish desktop (osx-arm64, self-contained)
        run: >
          dotnet publish ${{ env.DESKTOP }} -c Release -r osx-arm64 --self-contained true
          -p:PublishSingleFile=false -o out/mac/bin
      - name: Assemble .app bundle + icns + dmg
        run: |
          set -e
          APPNAME="ChinaDemographicModel"
          APP="out/mac/$APPNAME.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R out/mac/bin/* "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/ChinaDemographicModel.App.Desktop"
          # icns from the shared 1024 png
          ICON="$SHARED/Assets/appicon.png"
          mkdir icon.iconset
          sips -z 16 16     "$ICON" --out icon.iconset/icon_16x16.png
          sips -z 32 32     "$ICON" --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     "$ICON" --out icon.iconset/icon_32x32.png
          sips -z 64 64     "$ICON" --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   "$ICON" --out icon.iconset/icon_128x128.png
          sips -z 256 256   "$ICON" --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   "$ICON" --out icon.iconset/icon_256x256.png
          sips -z 512 512   "$ICON" --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   "$ICON" --out icon.iconset/icon_512x512.png
          cp "$ICON" icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>ChinaDemographicModel</string>
            <key>CFBundleDisplayName</key><string>中国人口结构 · 工作台</string>
            <key>CFBundleIdentifier</key><string>com.demo.chinademographicmodel</string>
            <key>CFBundleVersion</key><string>1.0.0</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundleExecutable</key><string>ChinaDemographicModel.App.Desktop</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          PLIST
          hdiutil create -volname "ChinaDemographicModel" -srcfolder "$APP" -ov -format UDZO out/mac/ChinaDemographicModel.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: out/mac/*.dmg

  # ---------- iOS: 未签名模拟器构建（真机安装需 Apple 开发者账号；标 extra，失败不阻塞）----------
  ios:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '${{ env.DOTNET_VERSION }}' }
      - name: Select newest installed Xcode
        # .NET-for-iOS 26.x 要求较新的 Xcode；选运行器上最新一版（不同 runner 镜像版本不一）
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Install ios workload
        run: dotnet workload install ios
      - name: Build (simulator, unsigned)
        run: >
          dotnet build ${{ env.IOSPROJ }} -c Release -f net10.0-ios
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:CodesignRequired=false -p:EnableCodeSigning=false
          -o out/ios
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: out/ios/**/*.app

  # ---------- 打 tag 时把产物汇总到 GitHub Release ----------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android, macos]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Flatten
        run: |
          mkdir -p release && find dist -type f \( -name '*.exe' -o -name '*.apk' -o -name '*.dmg' \) -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
